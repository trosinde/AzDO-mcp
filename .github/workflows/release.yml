name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release, e.g. v2.5.0'
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build, test and package
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart('v')
          ./build/build.ps1 -Version $version

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $assets = @(Get-ChildItem artifacts/releases -File | ForEach-Object FullName)
          $assets += @(Get-ChildItem artifacts/*-portable.zip | ForEach-Object FullName)
          $flags = @('--generate-notes', '--verify-tag')
          if ($env:TAG.Contains('-')) { $flags += '--prerelease' }
          gh release create $env:TAG @assets --title "AzDO MCP Manager $env:TAG" @flags
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
